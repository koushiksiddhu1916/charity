<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charity App Mockup</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="phone-container">
        <!-- Action Bar -->
        <header class="action-bar">
            <div class="title">Charity App</div>
            <div class="actions">
                <button id="btn-donate" title="Donate">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <button id="btn-more" title="More">
                    <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
            </div>
        </header>

        <!-- RecyclerView (List) -->
        <main id="campaign-list" class="recycler-view">
            <!-- Items will be injected here -->
        </main>

        <!-- Notification Area -->
        <div id="notification-container"></div>

        <!-- AlertDialog -->
        <div id="dialog-overlay" class="hidden">
            <div class="alert-dialog">
                <h3 id="dialog-title">Donate</h3>
                <p id="dialog-message">Enter donation amount for <span id="campaign-name"></span>:</p>
                <input type="number" id="donation-amount" placeholder="Amount ($)" autofocus>
                <div class="dialog-buttons">
                    <button id="dialog-cancel">CANCEL</button>
                    <button id="dialog-confirm">CONFIRM</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
